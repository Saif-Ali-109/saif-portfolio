services:
  portfolio-ai:
    build: ./portfolio/ai
    ports:
      - "8001:8001"
    env_file:
      - ./portfolio/ai/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8001
    restart: unless-stopped

  portfolio:
    build:
      context: ./portfolio
      args:
        - NEXT_PUBLIC_AI_API_URL=http://portfolio-ai:8001
        - NEXT_PUBLIC_ALLOWED_DEV_ORIGINS=
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - portfolio-ai
    restart: unless-stopped
